name: Bug report
description: Report a reproducible problem with DiffAtlas.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Include a small synthetic or redacted diff when useful. Do not include API keys, access tokens, or private code. For vulnerabilities, follow SECURITY.md.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the command or UI actions, demo/AI mode, and a minimal non-sensitive example.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: Release tag or commit hash
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Node.js version, browser, and deployment method. Include the model name for AI-only issues.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs or screenshots
      description: Remove secrets, private paths, and sensitive code before sharing.
